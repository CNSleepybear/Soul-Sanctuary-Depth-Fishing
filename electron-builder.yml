appId: com.soulsanctuary.depthfishing
productName: Soul Sanctuary
copyright: Copyright © 2026 Soul Sanctuary

directories:
  output: release
  buildResources: assets/icons

files:
  - dist/**/*
  - dist-electron/**/*
  - assets/icons/**/*
  - package.json

extraMetadata:
  main: dist/main/index.js

# ===== ASAR 反破解配置 =====
asar:
  smartUnpack: false
  ordering: null

win:
  target:
    - nsis
    - portable
  icon: assets/icons/icon.ico
  artifactName: ${name}-setup-${version}.${ext}
  # 签名配置（如需代码签名证书）
  # certificateFile: ''
  # certificatePassword: ''

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target: dmg
  icon: assets/icons/icon.png

linux:
  target: AppImage
  icon: assets/icons/icon.png

# ===== 压缩：最大化体积缩减 =====
compression: maximum

# ===== 移除未使用资源 =====
npmRebuild: false
nodeGypRebuild: false
